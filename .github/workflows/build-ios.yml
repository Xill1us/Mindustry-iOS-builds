name: Build Mindustry iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Mindustry 159.7
        uses: actions/checkout@v4
        with:
          repository: Anuken/Mindustry
          ref: v159.7
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check environment
        run: |
          java -version
          xcodebuild -version
          uname -m

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build iOS Application (.app)
        run: ./gradlew :ios:archive --stacktrace

      - name: Package Unsigned IPA
        run: |
          mkdir -p build_ipa/Payload
          cp -R ios/build/robovm/IOSLauncher.app build_ipa/Payload/
          cd build_ipa
          zip -r ../Mindustry-v159.7-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-Unsigned
          path: Mindustry-v159.7-unsigned.ipa
          if-no-files-found: error
