name: Build Mindustry iOS (Latest)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Mindustry 159.7
        uses: actions/checkout@v4
        with:
          repository: Anuken/Mindustry
          ref: v159.7
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Create Self-Signed Identity and Provisioning Profile
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain

          
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout cert.key -out cert.crt \
            -subj "/CN=iPhone Developer: Fake Dev (FAKE123456)"
          
          openssl pkcs12 -export -out cert.p12 -inkey cert.key -in cert.crt -passout pass:1234
          security import cert.p12 -k build.keychain -P 1234 -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

          
          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cat <<EOF > fake.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>AppIDName</key> <string>Mindustry</string>
              <key>ApplicationIdentifierPrefix</key> <array><string>FAKE123456</string></array>
              <key>CreationDate</key> <date>2026-01-01T00:00:00Z</date>
              <key>Name</key> <string>FakeProfile</string>
              <key>Entitlements</key>
              <dict>
                  <key>application-identifier</key> <string>FAKE123456.io.anuke.mindustry</string>
                  <key>get-task-allow</key> <true/>
              </dict>
              <key>UUID</key> <string>12345678-1234-1234-1234-1234567890ab</string>
              <key>Version</key> <integer>1</integer>
          </dict>
          </plist>
          EOF
          cp fake.plist ~/Library/MobileDevice/"Provisioning Profiles"/12345678-1234-1234-1234-1234567890ab.mobileprovision

      - name: Build iOS IPA
        run: ./gradlew :ios:createIPA --stacktrace

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-Unsigned
          path: "**/*.ipa"
          if-no-files-found: error
