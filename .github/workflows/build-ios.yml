name: Build Mindustry iOS (Latest)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Mindustry 159.7
        uses: actions/checkout@v4
        with:
          repository: Anuken/Mindustry
          ref: v159.7
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile iOS App
        run: ./gradlew :ios:build --stacktrace

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          # Находим скомпилированный .app бандл
          APP_PATH=$(find ios/build/robovm -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found!"
            exit 1
          fi
          echo "Packing app from: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r Mindustry-v159.7-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-Unsigned
          path: Mindustry-v159.7-unsigned.ipa
          if-no-files-found: error
