name: Build Mindustry iOS (.ipa)

on:
  workflow_dispatch: # Запуск вручную по кнопке из вкладки Actions

jobs:
  build-ios:
    runs-on: macos-14 # macOS с Apple Silicon и свежим Xcode

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true # Важно для подгрузки внутренних модулей

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      - name: Setup Gradle Wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
          fi
          chmod +x gradle

      - name: Build iOS IPA with RoboVM/MobiVM
        run: |
          # Запускаем сборку IPA через Gradle-таск MobiVM.
          # Флаг -Parchs=arm64 ускоряет сборку (собирает только под реальные 64-битные iPhone)
          ./gradlew :ios:createIPA -Parchs=arm64 --stacktrace

      - name: Find and Prepare IPA
        run: |
          mkdir -p output
          # Находим скомпилированный .ipa файл в билдах ios модуля
          IPA_PATH=$(find ios/build -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "IPA file not found!"
            exit 1
          fi
          echo "Found IPA at $IPA_PATH"
          cp "$IPA_PATH" output/Mindustry-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-Unsigned
          path: output/Mindustry-unsigned.ipa
          if-no-files-found: error
