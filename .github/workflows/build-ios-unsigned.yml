name: Build Mindustry for LiveContainer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Mindustry 159.7
        uses: actions/checkout@v4
        with:
          repository: Anuken/Mindustry
          ref: v159.7
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build iOS App via RoboVM
        run: ./gradlew :ios:robovmInstall -Probovm.archs=arm64 --stacktrace

      - name: Package App for LiveContainer
        run: |
          APP_PATH=$(find ios/build -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found!"
            ls -laR ios/build
            exit 1
          fi

          echo "Found bundle at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Mindustry-159.7-LiveContainer.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-LiveContainer
          path: Mindustry-159.7-LiveContainer.ipa
          if-no-files-found: error
