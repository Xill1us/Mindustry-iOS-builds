name: Build Mindustry iOS IPA (LiveContainer)

on:
  workflow_dispatch:
    inputs:
      mindustry_ref:
        description: 'Ветка/тег Anuken/Mindustry для сборки'
        required: false
        default: 'master'
      xcode_version:
        description: 'Версия Xcode (см. actions/runner-images для macos-14)'
        required: false
        default: '15.4'

jobs:
  build-ios:
    runs-on: macos-14
    env:
      # На случай если один из marketplace-экшенов ещё не обновился под Node 24 —
      # чисто предупреждение, сборку не ломает, но глушим заранее.
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Select Xcode ${{ github.event.inputs.xcode_version }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ github.event.inputs.xcode_version }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.robovm
          key: ${{ runner.os }}-gradle-mindustry-${{ github.event.inputs.mindustry_ref }}

      - name: Install ldid (fallback fakesign tool)
        run: brew install ldid

      # Arc должен лежать РЯДОМ с Mindustry (../../Arc относительно ios/), а не внутри
      - name: Clone Arc + Mindustry as sibling directories
        run: |
          set -e
          cd "$RUNNER_WORKSPACE"
          git clone --depth=1 https://github.com/Anuken/Arc
          git clone --depth=1 --branch "${{ github.event.inputs.mindustry_ref }}" https://github.com/Anuken/Mindustry
          echo "MINDUSTRY_DIR=$RUNNER_WORKSPACE/Mindustry" >> "$GITHUB_ENV"
          # Отдельная папка под логи — не зависит от того, где лежит Mindustry/чекаут репо,
          # так что шаги с логами не могут "молча" не выполниться из-за неверного пути.
          mkdir -p "$RUNNER_TEMP/logs"
          echo "LOG_DIR=$RUNNER_TEMP/logs" >> "$GITHUB_ENV"

      - name: Sanity check — confirm directories actually exist
        run: |
          echo "RUNNER_WORKSPACE=$RUNNER_WORKSPACE"
          echo "MINDUSTRY_DIR=$MINDUSTRY_DIR"
          ls -la "$RUNNER_WORKSPACE"
          test -d "$MINDUSTRY_DIR" && echo "OK: MINDUSTRY_DIR exists" || { echo "MISSING: MINDUSTRY_DIR"; exit 1; }
          test -f "$MINDUSTRY_DIR/gradlew" && echo "OK: gradlew found" || { echo "MISSING: gradlew"; exit 1; }

      # ios/build.gradle жёстко прописывает iosSkipSigning = false и требует
      # реальный Apple-сертификат/provisioning profile. Нам это не нужно —
      # LiveContainer переподписывает приложение сам при установке.
      - name: Patch ios/build.gradle to skip Apple code signing
        run: |
          cd "$MINDUSTRY_DIR"
          sed -i '' 's/iosSkipSigning = false/iosSkipSigning = true/' ios/build.gradle
          grep -n "iosSkipSigning" ios/build.gradle

      - name: Grant exec permission to gradlew
        run: chmod +x "$MINDUSTRY_DIR/gradlew"

      # ios:deploy = ios:copyAssets (tools:pack + copyNatives) + ios:createIPA
      # Если сборка упадёт именно на шаге подписи/архивации ipa, .app к этому
      # моменту уже скомпилирован на диске — его подхватит фолбэк-шаг ниже.
      #
      # ВАЖНО: cd делается ВНУТРИ скрипта (не через working-directory:), потому
      # что если working-directory: указывает на несуществующую папку, GitHub
      # Actions проваливает шаг ДО запуска shell — и никакого лога не остаётся
      # вообще, даже пустого. А так — лог создаётся в любом случае.
      #
      # Весь вывод Gradle уходит в файл, а не в консоль джобы — иначе с
      # --info/перерисовкой прогресс-бара легко получить лог на 20 000+ строк.
      # --console=plain убирает перерисовку прогресс-бара (главный источник
      # раздутия), --info не используется — обычный уровень логирования.
      - name: Build iOS app via RoboVM (ios:deploy)
        run: |
          set +e
          LOG="$LOG_DIR/build.log"
          : > "$LOG"

          if [ ! -d "$MINDUSTRY_DIR" ]; then
            echo "MINDUSTRY_DIR does not exist: $MINDUSTRY_DIR" >> "$LOG"
            echo "GRADLE_EXIT=127" >> "$GITHUB_ENV"
            exit 0
          fi

          (
            cd "$MINDUSTRY_DIR" && \
            chmod +x gradlew && \
            ./gradlew ios:deploy --stacktrace --console=plain --warning-mode=none
          ) > "$LOG" 2>&1
          echo "GRADLE_EXIT=$?" >> "$GITHUB_ENV"
          echo "Log written to $LOG"
          wc -l "$LOG"
          exit 0

      # Печатаем в лог джобы только релевантный кусок: от "Execution failed"
      # (или от "What went wrong") до конца, плюс отдельно все строки с
      # ошибками компоновщика/компилятора с небольшим контекстом. Полный
      # build.log всё равно уходит в артефакт ниже.
      - name: Extract compact failure excerpt
        if: always()
        run: |
          LOG="$LOG_DIR/build.log"
          OUT="$LOG_DIR/build-failure-excerpt.txt"

          if [ ! -f "$LOG" ]; then
            echo "build.log не найден по пути $LOG — предыдущий шаг не создал файл." > "$OUT"
            cat "$OUT"
            exit 0
          fi

          TOTAL=$(wc -l < "$LOG" | tr -d ' ')
          {
            echo "Gradle exit code: ${GRADLE_EXIT:-unknown}"
            echo "Total log lines: $TOTAL"
            echo

            START_LINE=$(grep -n -m1 -E "^\* What went wrong:|Execution failed for task" "$LOG" | head -n1 | cut -d: -f1)
            if [ -n "$START_LINE" ]; then
              echo "===== FAILURE BLOCK (from line $START_LINE, up to 300 lines) ====="
              tail -n +"$START_LINE" "$LOG" | head -n 300
            else
              echo "===== 'What went wrong' блок не найден, показываю хвост лога ====="
              tail -n 200 "$LOG"
            fi

            echo
            echo "===== Lines matching ld:/clang error:/Undefined symbols (with context) ====="
            grep -n -B2 -A20 -E "ld: |clang(\+\+)?: error|Undefined symbols|linker command failed" "$LOG" | head -n 300
          } > "$OUT"

          echo "----- excerpt (also uploaded as an artifact) -----"
          cat "$OUT"

      - name: Show what RoboVM produced (debug)
        run: |
          if [ ! -d "$MINDUSTRY_DIR" ]; then
            echo "MINDUSTRY_DIR missing, nothing to look for"
            exit 0
          fi
          cd "$MINDUSTRY_DIR"
          echo "---- *.ipa ----"
          find ios/build -iname "*.ipa" 2>/dev/null || true
          echo "---- *.app ----"
          find ios/build -iname "*.app" -maxdepth 6 2>/dev/null || true

      - name: Package / fakesign IPA for LiveContainer
        run: |
          set -e
          cd "$MINDUSTRY_DIR"

          IPA="$(find ios/build -iname '*.ipa' 2>/dev/null | head -n1 || true)"
          if [ -n "$IPA" ]; then
            echo "Gradle уже создал ipa: $IPA"
            cp "$IPA" "$GITHUB_WORKSPACE/Mindustry.ipa"
            exit 0
          fi

          APP="$(find ios/build -iname '*.app' -maxdepth 6 2>/dev/null | head -n1 || true)"
          if [ -z "$APP" ]; then
            echo "Ни .ipa, ни .app не найдены — сборка упала раньше компиляции."
            exit 1
          fi
          echo "Найден app-бандл: $APP"

          WORKDIR="$(mktemp -d)"
          mkdir -p "$WORKDIR/Payload"
          cp -R "$APP" "$WORKDIR/Payload/"

          APPCOPY="$(find "$WORKDIR/Payload" -maxdepth 1 -iname '*.app' | head -n1)"
          echo "Payload app: $APPCOPY"

          # fake-подпись (ldid) главного бинарника и всех вложенных dylib/framework —
          # без этого некоторые связанные с codesign проверки на устройстве могут ругаться
          find "$APPCOPY" -type f \( -perm -u+x -o -name "*.dylib" \) -print0 \
            | while IFS= read -r -d '' bin; do
                ldid -S "$bin" 2>/dev/null || true
              done

          (cd "$WORKDIR" && zip -r -y "$GITHUB_WORKSPACE/Mindustry.ipa" Payload)
          echo "Собран $GITHUB_WORKSPACE/Mindustry.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-LiveContainer
          path: Mindustry.ipa
          if-no-files-found: error

      - name: Upload build logs (for debugging failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ env.LOG_DIR }}/build.log
            ${{ env.LOG_DIR }}/build-failure-excerpt.txt
            ${{ env.MINDUSTRY_DIR }}/ios/build.gradle
            ${{ env.MINDUSTRY_DIR }}/ios/robovm.properties
            ${{ env.MINDUSTRY_DIR }}/build/reports/problems/problems-report.html
          if-no-files-found: warn
