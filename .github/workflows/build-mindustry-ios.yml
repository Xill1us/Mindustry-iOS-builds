name: Build Mindustry iOS (unsigned)

on:
  workflow_dispatch:
    inputs:
      arc_ref:
        description: "Ветка/тег Anuken/Arc (движка) для сборки"
        required: false
        default: "master"

permissions:
  contents: write

concurrency:
  group: build-mindustry-ios
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          echo "Установленные версии Xcode:"
          ls /Applications | grep -i '^Xcode' || true
          LATEST_XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -n "$LATEST_XCODE" ]; then
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-mindustry-ios-${{ runner.os }}
          restore-keys: |
            gradle-mindustry-ios-

      - name: Clone Mindustry (master) and Arc
        run: bash scripts/build-mindustry-ios.sh clone
        env:
          ARC_REF: ${{ inputs.arc_ref }}

      - name: Detect version
        id: version
        run: bash scripts/build-mindustry-ios.sh detect_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build unsigned IPA
        id: build
        run: bash scripts/build-mindustry-ios.sh build
        env:
          APP_BUILD_NUM: ${{ steps.version.outputs.app_build_num }}

      - name: Package artifact + checksum
        if: success()
        id: package
        run: bash scripts/build-mindustry-ios.sh package
        env:
          IPA_NAME: ${{ steps.version.outputs.ipa_name }}
          VERSION_DISPLAY: ${{ steps.version.outputs.version_display }}
          VERSION_HEAD_SHA: ${{ steps.version.outputs.head_sha }}

      - name: Write job summary
        if: always()
        run: bash scripts/build-mindustry-ios.sh summary
        env:
          JOB_STATUS: ${{ job.status }}
          IPA_NAME: ${{ steps.version.outputs.ipa_name }}
          VERSION_DISPLAY: ${{ steps.version.outputs.version_display }}

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-${{ github.run_number }}
          path: |
            build.log
            Mindustry/ios/build/**/*.log
            Mindustry/ios/robovm-build/**
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload IPA as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.ipa_name }}
          path: dist/${{ steps.version.outputs.ipa_name }}
          retention-days: 90

      - name: Publish testing (pre-release) with IPA
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: testing-${{ github.run_number }}-${{ steps.version.outputs.short_sha }}
          name: "Mindustry iOS (testing) — ${{ steps.version.outputs.version_display }}"
          prerelease: true
          body_path: release-notes.md
          files: |
            dist/${{ steps.version.outputs.ipa_name }}
            dist/${{ steps.version.outputs.ipa_name }}.sha256
